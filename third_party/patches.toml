# third_party/patches.toml: patch lint policy (tools/patch/lint.sh → build/patchlint).
# Rules: docs/08-upstream-and-patches.md §2. Every value below is the default. A key left out takes its default.
# An unknown key or an invalid value is a configuration error and the lint does not run (exit 2).

[budget]
# The maximum number of lines one patch may declare with `Budget:`. Above it, an approved overrun is required.
cap = 30
# How lines are counted: "added+removed" | "added" | "max" (the larger of added and removed)
count = "added+removed"
# Overrun approval: "owners" = `Budget-approved-by: <GitHub login>` must be a user who owns that patch in OWNERS.
#                   "forbidden" = a `Budget:` above cap is always a violation.
overrun = "owners"

[header]
# Whether the subject prefixes `[PATCH n/m]`, `[PATCH vN]`, `[PATCH vN n/m]` are allowed (default: only `[PATCH] droiduse: `).
numbered_subject = false
# Whether `From:` must be exactly one valid mailbox (`Name <user@host>` or `user@host`).
from_mailbox = true

[marker]
# Hunks that add no lines (removal-only hunks, file deletions): "fail" = a violation, because no `droiduse:` marker can be added | "allow" = no marker needed
removal_only = "fail"

[rules]
file_name = true               # file name `NNNN-droiduse-<name>.patch` (<name>: lowercase kebab-case)
series = true                  # series lists every patch exactly once, and every listed file exists
layer_matches_upstream = true  # `Layer:` equals [upstream.<x>].layer below
hook_for_exists = true         # the `Hook-for:` path exists in the repo
scope_cell_exists = true       # `Scope-cell:` equals the feature cell of a table row in docs/scope.md
readme = true                  # the generated patch table in patches/README.md matches the headers (generated by `cargo xtask patch-readme`)

[readme]
# Columns of the generated patch table, in order. "patch" is required.
# Possible values: patch, summary, purpose, hook-for, layer, budget, upstream, remove-when, scope-cell
columns = ["patch", "summary", "purpose", "hook-for", "layer", "budget", "upstream", "remove-when", "scope-cell"]

# For each third_party/<x>: the Layer it maps to, the series format ("file" = one patch file per line,
# "project-file" = `<project-path> <patch-file>`), and optionally a cap override (cap = <lines>).
# Every upstream with a patches/ directory must be listed here.
[upstream.wick]
layer = "vmm"
series = "file"

[upstream.aosp]
layer = "guest"
series = "project-file"

[upstream.kernel]
layer = "guest"
series = "file"

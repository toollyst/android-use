# droid-use Cargo workspace root.
#
# members:
#  - build/*: repo tooling (xtask entry point, layer checker, patch lint). Not a layer.
#  - contracts/*: every contract crate is picked up automatically.
#    Cargo refuses to load the workspace when a directory matched by a member
#    glob has no Cargo.toml, so contract directories that are not (yet) crates
#    are listed in `exclude` (an exclude entry for a missing path is harmless).
#  Crates in other layers are added explicitly. `cargo xtask check-layers` fails
#  on any Cargo.toml inside a layer that is not a workspace member (including
#  one inside an excluded contracts directory), so a crate cannot silently
#  escape the layer rules.
#
# exclude:
#  - contracts/compat: compat fixtures. contracts/codegen does not hold the generator config:
#    the generator and its config are build/codegen (codegen.toml); generated code is
#    committed in each contract's src/generated/.
#  - third_party: upstream code is not ours (CLAUDE.md §1.7, docs/08-upstream-and-patches.md); it is never a workspace
#    member and is not linted as our code by clippy.
[workspace]
resolver = "3"
members = [
    "build/checklayers",
    "build/codegen",
    "build/patchlint",
    "build/xtask",
    "clients/mcp",
    "clients/sdk/rust",
    "contracts/*",
    "host/entrypoints/adp_server",
    "host/runtime/auth",
    "host/runtime/instance",
    "host/vmm/api",
    "testing/e2e",
]
exclude = [
    "contracts/codegen",
    "contracts/compat",
    "third_party",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# External crates on the contracts allowlist (owner decision). Versions are set here and nowhere else.
async-trait = "0.1.92"
bytes = { version = "1.12.1", default-features = false }
futures-core = { version = "0.3.34", default-features = false, features = ["alloc"] }
futures-io = "0.3.34"
# prost: runtime for the generated guest_link and node message types (prost-build output uses the
# `::prost::Message` derive, `::prost::bytes` and `::prost::alloc`). The version must be in the same
# 0.14 series as prost-build in build/codegen.
prost = { version = "0.14.5", default-features = false, features = ["derive", "std"] }
# base64: base64 encoding and decoding of the adp `binary` type (RFC 4648 §4, padding and canonical form enforced).
base64 = "0.23.1"
# serde, serde_json (below, shared with the build/ entries): the JSON (de)serialization derives of the
# generated adp types, and the representation of an `object` without properties (an arbitrary JSON
# object: params, result and data of the envelope).
# host/ layers. tracing: spans at each layer, so one trace follows a call (docs/02-architecture.md §5).
# tokio: the async runtime (owner decision); host/ layers use it only as a test executor so far,
# clients/ at run time (each crate adds the features it needs).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }
# host/runtime/auth: getrandom (OS CSPRNG for the server token), subtle (constant-time digest
# comparison); sha2 and base64 below and above.
getrandom = "0.4.3"
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
# host/entrypoints/adp_server (owner decision: tokio, hyper 1 for the HTTP/1.1 upgrade, tokio-tungstenite
# for WebSocket framing, tracing): hyper-util and http-body-util (hyper's tokio glue and response
# bodies), futures-util (Stream/Sink of the WebSocket), semver (Connection.hello), clap (flags and
# environment), tracing-subscriber (the stderr log).
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
semver = "1.0.28"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "json", "std"] }
# clients/ only. rmcp: the official MCP Rust SDK (clients/mcp). The clients also use tokio-tungstenite
# (the ADP WebSocket client, hence `connect`), futures-util and getrandom from above.
rmcp = { version = "3.9.0", default-features = false }
# build/ tooling only.
# build/codegen: prost-build, prost-types (proto → Rust messages, reading protoc's FileDescriptorSet),
# ureq (pinned protoc download, rustls), zip (unpacking the official protoc release zip), sha2 (checking
# the pinned protoc hash), dirs (cache directory outside the repo), quote, proc-macro2, syn, prettyplease
# (assembling and printing the adp generated code, the same printer as prost-build), heck (name conversion).
dirs = "7"
heck = "0.5.0"
prettyplease = "0.3"
proc-macro2 = "1"
prost-build = { version = "0.14.5", default-features = false, features = ["format"] }
prost-types = "0.14.5"
quote = "1"
sha2 = "0.11"
syn = { version = "3", features = ["full"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
# diffy: git diff parser (build/patchlint). mailparse: RFC 5322/2047 header parser (build/patchlint).
# globset: OWNERS glob matching (build/patchlint; a crate that ignore already uses).
diffy = { version = "0.5.2", default-features = false }
globset = "0.4"
ignore = "0.4"
mailparse = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

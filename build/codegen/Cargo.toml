[package]
name = "codegen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generates the contract code committed under contracts/<x>/src/generated/ (cargo xtask codegen [--check])"

[dependencies]
dirs.workspace = true
heck.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
prost.workspace = true
prost-build.workspace = true
prost-types.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tempfile.workspace = true
toml.workspace = true
ureq.workspace = true
zip.workspace = true

[dev-dependencies]
# The generated contract code itself is exercised here (wire format of the adp types).
droiduse-contracts-adp = { path = "../../contracts/adp" }
droiduse-contracts-guest-link = { path = "../../contracts/guest_link" }
droiduse-contracts-node = { path = "../../contracts/node" }

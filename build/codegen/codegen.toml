# cargo xtask codegen configuration (build/codegen). Generated code is committed in each out directory,
# and `cargo xtask codegen --check` regenerates and compares it (stale output, hand-edited output and leftover files fail).
# The out directories belong to the generator: a file it does not generate makes --check fail, and generation deletes it.
# The protoc version and per-platform sha256 are in versions.toml [protoc].
# No key is required; a key left out takes the value written below as its default. An unknown key is an error.

# Protocol Buffers contracts: prost-build generates message types only (no service bindings, no tonic).
# Every .proto under root is compiled (proto root = -I). One `<package>.rs` per package.
[[proto]]
name = "guest_link"
root = "contracts/guest_link/proto"
out = "contracts/guest_link/src/generated"
# prost-build Config::bytes / btree_map paths. "." means every field.
bytes = ["."]
btree_map = []

[[proto]]
name = "node"
root = "contracts/node/proto"
out = "contracts/node/src/generated"
bytes = ["."]
btree_map = ["."]

# ADP contract: protocol.json → serde types (one module per domain + a top-level errors module).
[adp]
definition = "contracts/adp/protocol.json"
version = "contracts/adp/VERSION"
out = "contracts/adp/src/generated"
# Rust type of an `integer` without format. Possible values: "i64", "i32", "u32", "reject" (generation fails).
# Default "i64": protocol.json defines `integer` as a JSON number of at most 32 bits (64-bit values are decimal strings),
# but without format the signedness and width are not fixed. i64 is the smallest standard integer type that holds
# every int32 and uint32 value without loss, so it guesses no signedness and rejects no valid value.
# When the documentation fixes the width, add format in protocol.json or pin it per property with [adp.integer] below.
integer_without_format = "i64"
# Whether fields not in the definition are rejected on receipt (serde deny_unknown_fields). Default true: validate
# against the schema before processing (docs/10-security.md §4); unknown input is rejected (fail closed).
deny_unknown_fields = true

# The string enum type whose values a command's `targetTypes` picks from ("<Domain>.<Type>"). Default "Target.TargetType":
# protocol.json defines targetTypes as values of that type. If a command uses targetTypes and this type is missing
# or is not a string enum, that is an error.
target_type = "Target.TargetType"

# Per-property pinning of an `integer` without format. Keys: "<Domain>.<Type>.<property>",
# "<Domain>.<command>.parameters.<name>", "<Domain>.<command>.returns.<name>",
# "<Domain>.<event>.parameters.<name>". Values: "i64", "i32", "u32". A key not in the definition is an error.
[adp.integer]

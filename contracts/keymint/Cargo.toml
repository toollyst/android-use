# The version must equal contracts/keymint/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-keymint"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "keymint contract: guest KeyMint HAL ↔ host/runtime/keymint framing and authentication"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

# The version must equal contracts/common/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-common"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared contract types: error codes, W3C trace context, labels, frameId, event streams"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
futures-core = { workspace = true }

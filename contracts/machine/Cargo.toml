# 버전은 contracts/machine/VERSION 과 같아야 한다 (단일 원천: VERSION).
# 루트 workspace가 없어도 단독으로 빌드되고, 나중에 workspace 멤버가 되어도 그대로 동작하도록
# workspace 상속(`*.workspace = true`)을 쓰지 않는다.
[package]
name = "droiduse-contracts-machine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "machine 계약: runtime ↔ vmm (VM 하나의 정의와 제어)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
droiduse-contracts-common = { path = "../common" }
droiduse-contracts-spi = { path = "../spi" }

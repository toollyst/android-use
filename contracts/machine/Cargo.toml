# The version must equal contracts/machine/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-machine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "machine contract: runtime ↔ vmm (definition and control of one VM)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
droiduse-contracts-common = { path = "../common" }
droiduse-contracts-spi = { path = "../spi" }
async-trait = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }

# The version must equal contracts/device/VERSION (single source: VERSION).
# Workspace inheritance (`*.workspace = true`) is not used, so the crate builds on its own without
# the root workspace and keeps working unchanged once it is a workspace member.
[package]
name = "droiduse-contracts-device"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "device contract: vmm ↔ devices (Rust-side types of the vhost-user standard + extensions)"
publish = false

[lib]
path = "src/lib.rs"


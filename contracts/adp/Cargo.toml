# The version must equal contracts/adp/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-adp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "adp contract: ADP protocol definition (CDP-style domains, commands, events, types)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

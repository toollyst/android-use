# The version must equal contracts/spi/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-spi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "spi contract: core ↔ extension implementations"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
droiduse-contracts-common = { path = "../common" }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-io = { workspace = true }

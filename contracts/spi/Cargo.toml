# 버전은 contracts/spi/VERSION 과 같아야 한다 (단일 원천: VERSION).
# 패키지 필드는 workspace 상속(`*.workspace = true`)을 쓰지 않는다.
# 외부 의존의 버전은 루트 Cargo.toml `[workspace.dependencies]`가 단일 원천이다.
[package]
name = "droiduse-contracts-spi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "spi 계약: 코어 ↔ 확장 구현체"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
droiduse-contracts-common = { path = "../common" }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-io = { workspace = true }

# The version must equal contracts/guest_link/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-guest-link"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "guest_link contract: host ↔ guest vsock protocol (Protocol Buffers)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
prost.workspace = true

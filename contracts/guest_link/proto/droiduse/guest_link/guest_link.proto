// guest_link 계약: 호스트 ↔ 게스트(adpd) 프로토콜. 상세: docs/03-contracts.md guest_link.
//
// 전송: gRPC over vsock. 요청·응답 대응, 스트리밍, 메타데이터는 gRPC가 맡는다.
// 버전은 contracts/guest_link/VERSION (semver) 하나가 원천이다.
// 서비스 바인딩(tonic 등)은 이 계약을 쓰는 레이어에서 생성한다. 계약에는 이 파일과 메시지 타입만 있다.
//
// 메타데이터 키 (gRPC 메타데이터, 소문자):
//   droiduse-trace-id   레이어를 관통하는 trace ID (docs/02-architecture.md §5). 모든 호출에 실을 수 있다.
//                       값 표현은 contracts/common의 TraceId와 같다 (미정, ASCII 값).
//
// 처리 규칙 (docs/10-security.md §4): 버전 협상과 인증을 거친 뒤에만 처리하고, 메시지 크기 제한을 두며,
// 스키마 검증 후 처리한다. 열거형의 *_UNSPECIFIED 값은 거부한다.
//
// 이 파일에는 문서가 형태까지 정한 것만 있다. 문서가 이름만 정한 필드·메시지·RPC는 넣지 않았고
// "OPEN:" 주석으로 남겼다. 필드 번호는 추가만 하고 재사용하지 않는다.
//
// OPEN: 메시지 크기 제한 값 (docs/10 §4에 제한이 있다는 것만 있고 값이 없다).
// OPEN: 인증을 gRPC 채널에 묶는 방식 (첫 호출이 Auth여야 하는지, 호출마다 메타데이터로 토큰을 싣는지,
//       인증 전 호출이 돌려주는 상태 코드), 호스트가 호출하는 게스트 쪽 서비스에서 호스트를 인증하는 방식.
// OPEN: Inspect.Snapshot(TreeSnapshot), Inspect.Diff(TreeDiff), Inspect.Node의 결과 Node, Frame.Committed,
//       Action.Perform, App.*, App.Lifecycle, Log.Stream, WebView.Attach의 CDP 프록시 스트림,
//       Restore.Notify는 필수 필드의 형태가 정해지지 않아 넣지 않았다.

syntax = "proto3";

package droiduse.guest_link;

// ---------------------------------------------------------------------------
// 연결·인증. 호출 방향: 게스트 → 호스트 (구현: 호스트).
// ---------------------------------------------------------------------------

// 버전 협상 (필수). 게스트가 기동 후 처음 보낸다 (docs/06-guest-aosp.md §5).
service HelloService {
  // Hello. 협상할 수 없으면 실패한다 (UNSUPPORTED_VERSION에 해당).
  rpc Hello(droiduse.guest_link.Hello) returns (HelloResult);
}

// 인증. 인스턴스별 세션 토큰, restore 직후 복제본별 새 토큰.
service AuthService {
  // Auth: 세션 토큰을 제시한다.
  rpc Auth(droiduse.guest_link.Auth) returns (AuthResult);
  // Auth.Rebind: restore 직후 1회. 이전 토큰을 제시하고 복제본별 새 토큰을 받는다.
  // 이전 토큰은 폐기된다 (docs/10-security.md §4).
  rpc Rebind(AuthRebind) returns (AuthRebindResult);
}

// Hello 요청.
// OPEN: capabilities[] (원소 타입과 값 집합 미정).
message Hello {
  // guest_link 프로토콜 버전 (semver, contracts/guest_link/VERSION).
  string protocol_version = 1;
  // 게스트 빌드 fingerprint (Build.FINGERPRINT).
  string build_fingerprint = 2;
}

// Hello 결과. 문서에 결과 값이 없다.
message HelloResult {}

// Auth 요청.
message Auth {
  // 인스턴스별 세션 토큰 (불투명 비밀).
  bytes session_token = 1;
}

// Auth 결과. 문서에 결과 값이 없다.
message AuthResult {}

// Auth.Rebind 요청.
message AuthRebind {
  // restore 전의 세션 토큰 (불투명 비밀).
  bytes prev_token = 1;
  // 게스트가 본 VMGenID (16바이트).
  bytes vmgenid = 2;
}

// Auth.Rebind 결과.
message AuthRebindResult {
  // 이 복제본의 새 세션 토큰 (불투명 비밀).
  bytes session_token = 1;
}

// ---------------------------------------------------------------------------
// 공통 타입
// ---------------------------------------------------------------------------

// 트리·스크린샷·이벤트의 기준 프레임 (docs/04-adp.md §3.1, docs/03-contracts.md Frame.Committed).
message FrameId {
  // 디스플레이 번호.
  uint32 display = 1;
  // 앱 쪽 Choreographer vsync ID.
  int64 vsync_id = 2;
  // 합성 쪽 SurfaceFlinger 프레임 번호.
  uint64 sf_frame = 3;
}

// 인스펙션 데이터 소스 (docs/04-adp.md §3.4 source).
enum Source {
  // 값 없음. 받는 쪽은 거부한다.
  SOURCE_UNSPECIFIED = 0;
  // View 트리.
  SOURCE_VIEW = 1;
  // 접근성 트리.
  SOURCE_A11Y = 2;
  // Compose 시맨틱 트리.
  SOURCE_COMPOSE = 3;
  // WebView.
  SOURCE_WEBVIEW = 4;
  // SurfaceFlinger 레이어.
  SOURCE_LAYER = 5;
}

// ---------------------------------------------------------------------------
// 인스펙션. 호출 방향: 호스트 → 게스트 (구현: 게스트).
// OPEN: InspectService. Subscribe(server-streaming)의 스트림 원소와 Snapshot·Node의 결과 형태가
//       정해지지 않아 RPC를 넣지 않았다. 요청 메시지만 있다.
// ---------------------------------------------------------------------------

// Inspect.Subscribe 요청.
// OPEN: throttle_ms (정수 폭 미정).
message InspectSubscribe {
  // 구독할 소스.
  repeated Source sources = 1;
  // 구독할 디스플레이 번호 (FrameId.display).
  repeated uint32 displays = 2;
}

// Inspect.Node 요청.
message InspectNode {
  // 노드 ID (불투명 문자열, docs/04-adp.md §3.2).
  string node_id = 1;
}

// ---------------------------------------------------------------------------
// WebView. 호출 방향: 호스트 → 게스트 (구현: 게스트).
// ---------------------------------------------------------------------------

// WebView 디버깅 타깃.
// OPEN: Attach { target_id } → CDP 프록시 스트림. 스트림 원소 형태가 정해지지 않아 RPC를 넣지 않았다.
service WebViewService {
  // WebView.Targets: 타깃 목록.
  rpc Targets(WebViewTargets) returns (WebViewTargetsResult);
}

// WebView.Targets 요청. 문서에 인자가 없다.
message WebViewTargets {}

// WebView 디버깅 타깃 하나.
message WebViewTarget {
  // 타깃 ID.
  string target_id = 1;
  // 패키지 이름.
  string pkg = 2;
  // 현재 URL.
  string url = 3;
}

// WebView.Targets 결과.
message WebViewTargetsResult {
  // 타깃 목록.
  repeated WebViewTarget targets = 1;
}

// WebView.Attach 요청.
message WebViewAttach {
  // 붙을 타깃 ID (WebViewTarget.target_id).
  string target_id = 1;
}

// ---------------------------------------------------------------------------
// 디버그. 호출 방향: 호스트 → 게스트 (구현: 게스트). 호스트 인가 전용, CTS/VTS용.
// ---------------------------------------------------------------------------

// 디버그.
service DebugService {
  // Debug.SetAdb: adbd 켜기·끄기.
  rpc SetAdb(DebugSetAdb) returns (DebugSetAdbResult);
}

// Debug.SetAdb 요청.
message DebugSetAdb {
  // 켜면 true.
  bool enabled = 1;
}

// Debug.SetAdb 결과. 문서에 결과 값이 없다.
message DebugSetAdbResult {}

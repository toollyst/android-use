// guest_link contract: host ↔ guest (adpd) protocol. Details: docs/03-contracts.md guest_link.
//
// Transport: gRPC over vsock. gRPC handles request/response correlation, streaming and metadata.
// The single source of the version is contracts/guest_link/VERSION (semver).
// Service bindings (tonic, etc.) are generated by the layers that use this contract. The contract holds only this file and the message types.
// Names follow the buf STANDARD lint rules (XxxService, <Rpc>Request, <Rpc>Response).
//
// Connections (docs/03-contracts.md guest_link): two gRPC channels on two vsock ports.
//   - Host channel: the host is the server. The host implements the guest → host services (HelloService, AuthService, and
//     future services the guest initiates), and adpd opens the connection.
//   - Guest channel: adpd is the server. adpd implements the host → guest services (InspectService, WebViewService,
//     DebugService, etc.), and the host opens the connection.
//     Only adpd's SELinux domain may use listening vsock sockets, which protects this port: SELinux
//     has no per-port labelling for vsock (docs/10-security.md §4).
//   - The two port numbers are host and guest settings with defaults. They are not contract constants.
//   - Each service is offered only on its own channel. Calling a service the other channel does not have is gRPC UNIMPLEMENTED.
//
// Metadata keys (gRPC metadata, lowercase):
//   traceparent, tracestate      W3C Trace Context. The trace that runs through the layers (docs/02-architecture.md §5).
//                                Every call carries traceparent. A missing or invalid traceparent makes the
//                                receiver start a new trace and drop tracestate (W3C Trace Context
//                                https://www.w3.org/TR/trace-context/ sections 3.2, 3.3 and 4.3).
//   droiduse-session-token-bin   Session token (opaque secret, binary metadata). See the authentication rules below.
//
// Authentication (docs/10-security.md §4):
//   - Every call on both channels carries a valid session token in droiduse-session-token-bin. If it is missing or wrong:
//     gRPC UNAUTHENTICATED. No RPC can be called without authentication.
//   - The first session token reaches the guest on a dedicated secret disk that the VMM attaches. Only adpd's SELinux
//     domain can read that disk.
//   - Rebind changes the token after every restore. When Rebind succeeds, the previous token is revoked, and later calls
//     on both channels carry the new token.
//   OPEN: how the secret disk is attached through the machine contract (VmSpec), and whether the disk contents are also
//         replaced with the new token after Rebind (when adpd restarts it reads the token from the disk again).
//
// Processing rules (docs/10-security.md §4): a message is processed only after version negotiation and authentication,
// and only after schema validation.
// One Hello on the host channel negotiates the version for both channels.
// *_UNSPECIFIED enum values are rejected.
// Message size limits are per channel and set separately on the host and the guest. The default is the gRPC default (4 MiB).
//
// Errors: gRPC status codes (https://github.com/grpc/grpc/blob/master/doc/statuscodes.md).
//   - A failure that has a droiduse ErrorCode (contracts/common) also carries google.rpc.ErrorInfo
//     (googleapis google/rpc/error_details.proto) in the details of the google.rpc.Status sent in the
//     grpc-status-details-bin trailer: reason = the ErrorCode name (for example NODE_GONE),
//     domain = "droiduse.guest_link".
//   - No compatible version at Hello: FAILED_PRECONDITION with reason UNSUPPORTED_VERSION. A guest
//     channel call before the host channel Hello succeeded: FAILED_PRECONDITION.
//   - Which gRPC status code each other ErrorCode uses is not defined yet.
//
// This file holds only what the documentation and owner decisions have fixed down to its shape. Fields, messages and
// RPCs that only have a name are left out and recorded in "OPEN:" comments. Field numbers are only added, never reused.
//
// OPEN: Inspect.Snapshot (TreeSnapshot), Inspect.Diff (TreeDiff), the result Node of Inspect.Node, Frame.Committed,
//       Action.Perform, App.*, App.Lifecycle, Log.Stream, the CDP proxy stream of WebView.Attach and
//       Restore.Notify are left out because the shape of their required fields is not fixed.

syntax = "proto3";

package droiduse.guest_link;

// ---------------------------------------------------------------------------
// Connection and authentication. Host channel: guest → host (implemented by the host).
// ---------------------------------------------------------------------------

// Version negotiation (mandatory). The guest sends it first on the host channel after it starts (docs/06-guest-aosp.md §5).
service HelloService {
  // Hello. When the versions cannot be negotiated: FAILED_PRECONDITION with ErrorInfo reason
  // UNSUPPORTED_VERSION (see Errors above).
  rpc Hello(HelloRequest) returns (HelloResponse);
}

// Session token rotation. Authentication itself is the token every call carries (see Authentication above).
service AuthService {
  // Auth.Rebind: once, right after restore. Presents the previous token and receives a new per-clone token.
  // The previous token is revoked (docs/10-security.md §4). The metadata carries the previous token.
  rpc Rebind(RebindRequest) returns (RebindResponse);
}

// Hello request.
message HelloRequest {
  // guest_link protocol version (semver, contracts/guest_link/VERSION).
  string protocol_version = 1;
  // Guest build fingerprint (Build.FINGERPRINT).
  string build_fingerprint = 2;
  // Names of optional features the guest supports. A receiver ignores names it does not know. No
  // names are defined yet.
  repeated string capabilities = 3;
}

// Hello result. The documentation defines no result values.
message HelloResponse {}

// Auth.Rebind request.
message RebindRequest {
  // Session token from before the restore (opaque secret).
  bytes prev_token = 1;
  // The VMGenID as seen by the guest (16 bytes).
  bytes vmgenid = 2;
}

// Auth.Rebind result.
message RebindResponse {
  // New session token of this clone (opaque secret).
  bytes session_token = 1;
}

// ---------------------------------------------------------------------------
// Common types
// ---------------------------------------------------------------------------

// The reference frame of trees, screenshots and events (docs/04-adp.md §3.1, docs/03-contracts.md Frame.Committed).
message FrameId {
  // Display number.
  uint32 display = 1;
  // App-side Choreographer vsync ID.
  int64 vsync_id = 2;
  // Composition-side SurfaceFlinger frame number.
  uint64 sf_frame = 3;
}

// Inspection data source (docs/04-adp.md §3.4 source).
enum Source {
  // No value. The receiver rejects it.
  SOURCE_UNSPECIFIED = 0;
  // View tree.
  SOURCE_VIEW = 1;
  // Accessibility tree.
  SOURCE_A11Y = 2;
  // Compose semantics tree.
  SOURCE_COMPOSE = 3;
  // WebView.
  SOURCE_WEBVIEW = 4;
  // SurfaceFlinger layers.
  SOURCE_LAYER = 5;
}

// ---------------------------------------------------------------------------
// Inspection. Guest channel: host → guest (implemented by the guest).
// OPEN: InspectService. The RPCs are left out because the stream element of Subscribe (server-streaming) and the
//       result shapes of Snapshot and Node are not fixed. Only the request messages exist.
// ---------------------------------------------------------------------------

// Inspect.Subscribe request.
message SubscribeRequest {
  // Sources to subscribe to.
  repeated Source sources = 1;
  // Display numbers to subscribe to (FrameId.display).
  repeated uint32 displays = 2;
  // Minimum time between two events of the subscription, in milliseconds. 0: no throttling.
  uint32 throttle_ms = 3;
}

// Inspect.Node request.
message NodeRequest {
  // Node ID (opaque string, docs/04-adp.md §3.2).
  string node_id = 1;
}

// ---------------------------------------------------------------------------
// WebView. Guest channel: host → guest (implemented by the guest).
// ---------------------------------------------------------------------------

// WebView debugging targets.
// OPEN: Attach { target_id } → CDP proxy stream. The RPC is left out because the shape of the stream element is not fixed.
service WebViewService {
  // WebView.Targets: list of targets.
  rpc Targets(TargetsRequest) returns (TargetsResponse);
}

// WebView.Targets request. The documentation defines no arguments.
message TargetsRequest {}

// One WebView debugging target.
message WebViewTarget {
  // Target ID.
  string target_id = 1;
  // Package name.
  string pkg = 2;
  // Current URL.
  string url = 3;
}

// WebView.Targets result.
message TargetsResponse {
  // List of targets.
  repeated WebViewTarget targets = 1;
}

// WebView.Attach request.
message AttachRequest {
  // ID of the target to attach to (WebViewTarget.target_id).
  string target_id = 1;
}

// ---------------------------------------------------------------------------
// Debug. Guest channel: host → guest (implemented by the guest). Host-authorized only, for CTS/VTS.
// ---------------------------------------------------------------------------

// Debug.
service DebugService {
  // Debug.SetAdb: turns adbd on or off.
  rpc SetAdb(SetAdbRequest) returns (SetAdbResponse);
}

// Debug.SetAdb request.
message SetAdbRequest {
  // true to turn it on.
  bool enabled = 1;
}

// Debug.SetAdb result. The documentation defines no result values.
message SetAdbResponse {}

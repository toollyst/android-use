[layer]
name = "contracts"
allow = []          # self-contained: shared types (error codes, trace IDs, etc.) also live inside contracts

# Sibling contracts must not depend on each other. Exceptions are one-way edges only (module = [sibling modules it may depend on]).
# Only edges the crates actually use today are listed. checklayers rejects two-way and cyclic edges.
[allow_siblings]
machine  = ["common", "spi"]
instance = ["common", "spi"]
spi      = ["common"]

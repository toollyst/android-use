# The version must equal contracts/instance/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-instance"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "instance contract: services ↔ runtime (one instance)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
droiduse-contracts-common = { path = "../common" }
droiduse-contracts-spi = { path = "../spi" }
async-trait = { workspace = true }

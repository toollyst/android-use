# 버전은 contracts/node/VERSION 과 같아야 한다 (단일 원천: VERSION).
# 패키지 필드는 workspace 상속(`*.workspace = true`)을 쓰지 않는다.
# 외부 의존의 버전은 루트 Cargo.toml `[workspace.dependencies]`가 단일 원천이다.
[package]
name = "droiduse-contracts-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "node 계약: control plane ↔ node 데몬 (Protocol Buffers, gRPC)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
prost.workspace = true

# The version must equal contracts/node/VERSION (single source: VERSION).
# Package fields do not use workspace inheritance (`*.workspace = true`).
# The root Cargo.toml `[workspace.dependencies]` is the single source of external dependency versions.
[package]
name = "droiduse-contracts-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "node contract: control plane ↔ node daemon (Protocol Buffers, gRPC)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
prost.workspace = true

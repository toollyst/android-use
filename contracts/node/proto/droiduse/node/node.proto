// node contract: control plane ↔ node daemon (gRPC over TLS, authenticated). Details: docs/03-contracts.md node.
//
// The single source of the version is contracts/node/VERSION (semver).
//
// Service bindings (tonic, etc.) are generated by the layers that use this contract. The contract holds only this file and the message types.
// Names follow the buf STANDARD lint rules (XxxService, <Rpc>Request, <Rpc>Response).
//
// Metadata keys (gRPC metadata, lowercase):
//   traceparent, tracestate   W3C Trace Context. The trace that runs through the layers (docs/02-architecture.md §5).
//                             Any call can carry them. The same as guest_link.
//
// This file holds only what the documentation has fixed down to the shape of the fields. Fields and RPCs that the
// documentation only names are left out and recorded in "OPEN:" comments in their place. Field numbers are only added,
// never reused.
// instance_id and snapshot_ref are opaque strings, the same as InstanceId and SnapshotRef of the instance and spi contracts.
//
// OPEN: Node.Info, Node.Health, Instance.Create, Instance.Destroy / Get / List, Session.Acquire /
//       Reset / Release, Events.Stream are left out because the shape of their required fields is not fixed.

syntax = "proto3";

package droiduse.node;

// Snapshot export and import (through SnapshotStore).
service SnapshotService {
  // Snapshot.Export: exports an instance as a snapshot.
  rpc Export(ExportRequest) returns (ExportResponse);
  // Snapshot.Import: imports a snapshot.
  rpc Import(ImportRequest) returns (ImportResponse);
}

// Debug. For CTS/VTS; not exposed in ADP or MCP.
service DebugService {
  // Debug.SetAdb: turns the instance's adbd on or off.
  rpc SetAdb(SetAdbRequest) returns (SetAdbResponse);
}

// Snapshot.Export request.
message ExportRequest {
  // Instance to export.
  string instance_id = 1;
}

// Snapshot.Export result.
message ExportResponse {
  // Reference to the stored snapshot.
  string snapshot_ref = 1;
}

// Snapshot.Import request.
message ImportRequest {
  // Reference to the snapshot to import.
  string snapshot_ref = 1;
}

// Snapshot.Import result. The documentation defines no result values.
message ImportResponse {}

// Debug.SetAdb request.
message SetAdbRequest {
  // Target instance.
  string instance_id = 1;
  // true to turn it on.
  bool enabled = 2;
}

// Debug.SetAdb result. The documentation defines no result values.
message SetAdbResponse {}

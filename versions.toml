# versions.toml: the single source (lock) for the combination of all components
# Release bundle version = based on a hash of this file's contents. Every image must be traceable back to its components.
# TBD values are fixed in M0.

[bundle]
schema = 1

[wick]
repo   = "https://github.com/toollyst/wick"
commit = "TBD"               # wick pins the Firecracker version (at the time of writing: based on v1.18.0)

[aosp]
manifest_url = "https://android.googlesource.com/platform/manifest"
tag          = "android-17.0.0_r1"         # pinned release tag. AOSP source is published twice a year (Q2/Q4)
asb_level    = "2026-06-05"         # applied Android Security Bulletin level (YYYY-MM-DD)

[kernel]
gki_branch = "TBD"           # android-common GKI branch
gki_build  = "TBD"           # build ID of the Google-signed GKI prebuilt
kmi_check  = true

[gfxstream]
rev = "TBD"

[rutabaga]
rev = "TBD"

[protocol]
# Only serialization contracts negotiated across process or machine boundaries are listed. In-process trait contracts (machine, instance)
# and contracts based on a standard protocol (device = vhost-user) are versioned only by their own contracts/<name>/VERSION.
adp        = "0.1.0"
guest_link = "0.1.0"
keymint    = "0.1.0"          # framing and authentication version. The payload is the kmr wire format of the [aosp] tag
node       = "0.1.0"
spi        = "0.1.0"

[protoc]
# The official protoc release used by build/codegen (`cargo xtask codegen`). No protoc that does not match this version and hash is used.
# A downloaded zip is kept in a cache outside the repo only if its sha256 equals the value below, and it is verified again before every run.
# protoc on PATH and the PROTOC environment variable are ignored. The binary is never committed to the repo.
# To upgrade: change version and the per-platform sha256 together and regenerate with `cargo xtask codegen`.
version = "36.2"
url     = "https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-{platform}.zip"

[protoc.sha256]
# Keys are the platform names of the release zips. Generation fails on a host not listed here.
linux-aarch_64 = "8b8f18bd2b30346efbc698dd5a73dd7c805f3ef8380f6dfc95c768f3f1852f6a"
linux-x86_64   = "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278"
osx-aarch_64   = "9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466"
osx-x86_64     = "228cc7add4616cc14ca5e80dee83209d44449a7aee95a914ae748fa374efb078"
win64          = "f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3"

[images]
# hashes of build outputs (filled in by CI)
wick_arm64  = "TBD"
wick_x86_64 = "TBD"

# Host-side baseline checks (docs/11-quality-and-testing.md §5, CLAUDE.md §6).
# The toolchain is pinned by rust-toolchain.toml. Third-party actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main are never cancelled,
# so every main commit gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # v1 hosts: Linux x86_64 and arm64, macOS arm64, Windows x86_64
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # --locked: if this first step rewrote Cargo.lock, the later --locked steps would miss a
      # stale lock file.
      - name: Layer rules
        run: cargo --locked xtask check-layers
      - name: Patch lint
        shell: bash
        run: bash tools/patch/lint.sh
      # The committed generated code matches the IDL and settings (stale, hand-edited, missing
      # or orphan files fail). protoc is only the official release pinned in versions.toml
      # [protoc], verified by sha256 and kept in a cache outside the repo.
      - name: Codegen
        run: cargo --locked xtask codegen --check
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # --no-fail-fast: every test target runs and reports, also after one of them fails.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

[package]
name = "droiduse-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust ADP client: connect with a bearer token, Connection.hello, typed commands"

[lib]
path = "src/lib.rs"

[features]
# A fake ADP server for the tests of this crate and of its users (clients/mcp). Not for products.
test-support = []

[dependencies]
droiduse-contracts-adp = { path = "../../../contracts/adp" }
droiduse-contracts-common = { path = "../../../contracts/common" }
futures-util.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tokio-tungstenite.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

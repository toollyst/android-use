[package]
name = "droiduse-entrypoints-adp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "host/entrypoints/adp_server: the ADP WebSocket JSON-RPC server"

[[bin]]
name = "droiduse-adp-server"
path = "src/main.rs"

[dependencies]
droiduse-contracts-adp = { path = "../../../contracts/adp" }
droiduse-contracts-common = { path = "../../../contracts/common" }
droiduse-contracts-instance = { path = "../../../contracts/instance" }
droiduse-contracts-machine = { path = "../../../contracts/machine" }
droiduse-contracts-spi = { path = "../../../contracts/spi" }
droiduse-runtime-auth = { path = "../../runtime/auth" }
droiduse-runtime-instance = { path = "../../runtime/instance" }
bytes.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect"] }

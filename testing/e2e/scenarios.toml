# E2E scenario inventory (docs/11-quality-and-testing.md §7, docs/13-roadmap.md §3).
# The red scenarios are the remaining work. Run: testing/e2e/run.sh <target>.
#
# Per scenario:
#   id         dot-separated lowercase words; stable (not tied to the milestone)
#   title      one line: the verifiable behaviour
#   milestone  m0..m6: the gate the scenario belongs to
#   scope      the docs/scope.md row (Feature cell) it covers, or gate:M0..gate:M6
#   tags       area tags (run.sh filters on them); never a milestone name or `all`
#   needs      in order: the contract surfaces first, then the components in call order.
#              `<component>` is located through DROIDUSE_E2E_<COMPONENT PATH>;
#              `contracts/adp#<Domain.name or ERROR_CODE>` is met when protocol.json defines
#              it; any other `<component>#<surface>` is a surface no contract defines yet.
#   expect     "pass", or "red" with `reason` (error code UNIMPLEMENTED). Strict: the first
#              unmet need, or the reason a component answers UNIMPLEMENTED with, must equal
#              `reason`; anything else is FAIL.
#
# Reason convention (one place in code: manifest::Reason): missing:<component>,
# missing:<component>#<surface>, <component>#<operation>.
#
# M0 protocol scenarios are expected to PASS once the stub binaries exist; the feature
# scenarios (M1-M6) stay red until their features land.

# Per-scenario timeout in seconds.
timeout_s = 120

# ---------------------------------------------------------------------------------------
# docs/scope.md v1 rows that no MCP/ADP-level scenario can verify
# ---------------------------------------------------------------------------------------

[[not_e2e]]
scope = "KeyMint (host)"
why = "ADP has no keystore surface; KeyMint is verified by the VTS KeyMint suite and CTS keystore tests on the release image (testing/cts) and by host/runtime/keymint tests"

[[not_e2e]]
scope = "Host: macOS arm64 · Linux arm64"
why = "a host-matrix row: verified by running the whole E2E suite on each host of the boot matrix (docs/11 §4), not by a scenario of its own"

[[not_e2e]]
scope = "Host: Linux x86_64 · Windows x86_64"
why = "a host-matrix row: verified by running the whole E2E suite on each host of the boot matrix (docs/11 §4, M5 gate), not by a scenario of its own"

[[not_e2e]]
scope = "Re-authentication after cloning"
why = "the guest_link session token is a secret that never crosses ADP; token rotation and revocation are verified by host/runtime/identity and guest restore tests"

[[not_e2e]]
scope = "Release bundle · signing · SBOM"
why = "a property of the release artifacts, verified by the tools/bundle checks (signature, SBOM, provenance, reproducibility), not by driving a running instance"


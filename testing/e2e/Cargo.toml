[package]
name = "droiduse-testing-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "E2E runner: the v1 scenario inventory, strict outcome matching, the report of remaining work"

[lib]
path = "src/lib.rs"

[[bin]]
name = "e2e"
path = "src/main.rs"

[dependencies]
# The protocol version only; the components themselves run as separate processes.
droiduse-contracts-adp = { path = "../../contracts/adp" }
futures-util.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "time"] }
tokio-tungstenite.workspace = true
toml.workspace = true

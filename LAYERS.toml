# LAYERS.toml: layer definitions and dependency rules (enforced by build/checklayers)
# Rules:
#  1) Dependencies go only from a higher level to a lower level
#  2) Sibling directories on the same level must not depend on each other directly (go through contracts)
#     Inside one layer, top-level modules (e.g. host/services/screen → host/services/inspect) must not depend on each other directly either.
#     Inside one top-level module (e.g. inspect → inspect/proto) it is allowed.
#     Exceptions are only one-way edges in the [allow_siblings] table of the layer-root LAYER.toml
#     (<module> = ["<sibling module it may depend on>", ...]). Two-way and cyclic edges are rejected. They cannot be put in a nested LAYER.toml.
#  3) Every layer may depend on contracts; contracts itself depends on no other layer (self-contained)
#     External crates: only crates.io crates named in [contracts] allow_external below
#  4) A directory's LAYER.toml may narrow the detailed allowlist for that directory (it cannot widen it)
#  5) clients depends only on contracts. No product code depends on clients
# path = actual location relative to the repo root

[[layer]]
name  = "third_party"
path  = "third_party"
level = 0

[[layer]]
name  = "contracts"
path  = "contracts"
level = 1          # special: every layer may reference it, it has no dependencies itself
special = "contracts"

[[layer]]
name  = "base"
path  = "host/base"
level = 1

[[layer]]
name  = "vmm"
path  = "host/vmm"
level = 2

[[layer]]
name  = "devices"
path  = "host/devices"
level = 2

[[layer]]
name  = "guest"
path  = "guest"
level = 3          # goes into the AOSP build tree. Also enforced by Soong visibility

[[layer]]
name  = "runtime"
path  = "host/runtime"
level = 4

[[layer]]
name  = "services"
path  = "host/services"
level = 5

[[layer]]
name  = "entrypoints"
path  = "host/entrypoints"
level = 6

[[layer]]
name  = "clients"
path  = "clients"
level = 6          # sibling of entrypoints: no dependencies between them. Talks to the host only through ADP (contracts/adp)
special = "clients"

[[layer]]
name  = "testing"
path  = "testing"
level = 7          # may reference every layer for testing; product code must not depend on testing

[forbidden]
# Concept-level forbidden rules (checked by the lint)
# Checked: identifiers, string literals, file and directory names, dependency crate names
#   Case-insensitive, word-prefix match: words that "start with" a forbidden word are caught too (android → androidboot, tenant → tenants).
#   Words are split at _ - . whitespace, camelCase and letter/digit boundaries. A multi-word concept (package_name) matches
#   consecutive words, and only its last word is prefix-matched (package_names is caught, packages_name is not).
#   For *.patch / *.diff only the lines the patch adds are checked (+, excluding the +++ file header). Context lines, removed lines and headers are not. File names are.
# Not checked: comments and documents (*.md). "Describing" a concept is allowed; code that "handles" the concept is blocked.
# Example: host/vmm/boot handles only the boot image v4 "container format". The androidboot.* values are built by runtime and passed on as an opaque bootconfig.
"vmm"     = ["android", "aosp", "package_name", "activity"]
"devices" = ["android", "aosp", "package_name", "activity"]
"*"       = ["qemu", "tenant", "billing"]   # forbidden in the whole core (comments/documents excepted)

[forbidden_exceptions]
# Exceptions for false positives of the prefix match (added only after review). Key = forbidden concept, value = allowed words (each one exactly matching word).
# They apply only to that concept, and may only be words longer than, and starting with, the concept's last word (not the concept word itself).
# Example: "activity" = ["activityx"]  → only activityx is allowed; activityxy and activity stay forbidden
# (currently empty)

[contracts]
# External (crates.io) crates a contracts crate may depend on. Applies to normal, build and dev dependencies.
# A crate not on the list, or from a source other than crates.io (git, another registry), is a violation. No wildcards.
allow_external = ["async-trait", "base64", "bytes", "futures-core", "futures-io", "prost", "serde", "serde_json"]
